<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charaktere – Call of Cthulhu</title>
<style>
  :root {
    --bg: #14110f;
    --panel: #1e1915;
    --panel-2: #26201a;
    --border: #3d3228;
    --text: #e8dfd0;
    --muted: #9a8c78;
    --accent: #7fa37a;
    --accent-2: #b8863b;
    --danger: #c0594a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.35;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 10px 32px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px;
    padding-bottom: 3px; border-bottom: 1px solid var(--border); }
  h2 { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); margin: 0; font-weight: normal; }
  a { color: inherit; text-decoration: none; }
  .links { display: flex; gap: 6px; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 10px; font-size: .8rem; color: var(--text);
  }
  .btn:hover { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dotted var(--border); }
  .row:last-child { border-bottom: 0; }
  .row .main { flex: 1 1 auto; min-width: 0; display: block; }
  .row .main:hover .name { color: var(--accent); }
  .name { display: block; font-size: 1.05rem; line-height: 1.2; }
  .sub { display: block; font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
  .row .edit { flex: 0 0 auto; font-size: .75rem; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 8px; }
  .row .edit:hover { color: var(--text); border-color: var(--accent); }
  .hint { font-size: .8rem; color: var(--muted); padding: 6px 0 2px; }
  .hint.error { color: var(--danger); }
  code { background: var(--panel-2); padding: 0 4px; border-radius: 3px; font-size: .85em; }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <div class="head-row">
      <h2>Charaktere</h2>
      <span class="links">
        <a class="btn" href="bogen.html">Bogen</a>
        <a class="btn" href="editor.html">Editor</a>
      </span>
    </div>
    <div id="list"></div>
    <div id="hint" class="hint">Lade Liste …</div>
  </section>
</div>

<script>
/* Charakterdateien liegen im Ordner „charakter“. Die Seite liest nur die Liste
   charakter/liste.json (Array mit Dateinamen). Erzeugt wird sie lokal mit
   „node liste_erzeugen.js“. */
const ORDNER = "charakter";
const BOGEN = "bogen.html";
const EDITOR = "editor.html";
const MANIFEST = "liste.json";

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}

async function ausManifest() {
  try {
    const r = await fetch(`${ORDNER}/${MANIFEST}`, { cache: "no-store" });
    if (!r.ok) return [];
    const a = await r.json();
    return (Array.isArray(a) ? a : []).map(x => typeof x === "string" ? x : x && x.datei).filter(Boolean);
  } catch (_) { return []; }
}

async function kurzinfo(datei) {
  const fallback = { datei, name: datei.replace(/\.json$/i, ""), spieler: "", beruf: "" };
  try {
    const r = await fetch(`${ORDNER}/${encodeURIComponent(datei)}`, { cache: "no-store" });
    if (!r.ok) return fallback;
    const j = await r.json();
    const c = (j && (j.charakter || j.character)) || {};
    return { datei, name: c.name || fallback.name, spieler: c.spieler || "", beruf: c.beruf || "" };
  } catch (_) { return fallback; }
}

function zeile(c) {
  const pfad = `${ORDNER}/${c.datei}`;
  const row = el("div", "row");
  const main = el("a", "main");
  main.href = `${BOGEN}?json=${encodeURIComponent(pfad)}`;
  main.append(el("span", "name", c.name));
  const sub = [c.spieler, c.beruf].filter(Boolean).join(" · ");
  if (sub) main.append(el("span", "sub", sub));
  const edit = el("a", "edit", "Bearbeiten");
  edit.href = `${EDITOR}?json=${encodeURIComponent(pfad)}`;
  row.append(main, edit);
  return row;
}

(async function start() {
  const alle = (await ausManifest())
    .map(n => String(n).replace(/^\.?\/?charakter\//i, ""))
    .filter(n => /\.json$/i.test(n) && n.toLowerCase() !== MANIFEST);
  const namen = [...new Set(alle)];
  const liste = $("list");
  const hint = $("hint");

  if (!namen.length) {
    hint.className = "hint error";
    hint.textContent = "Keine Charaktere gefunden. Die Liste „" + ORDNER + "/" + MANIFEST +
      "“ fehlt oder ist leer – lokal mit „node liste_erzeugen.js“ erzeugen und hochladen.";
    return;
  }

  const infos = await Promise.all(namen.map(kurzinfo));
  infos.sort((a, b) => a.name.localeCompare(b.name, "de", { sensitivity: "base" }));
  liste.replaceChildren(...infos.map(zeile));
  hint.textContent = infos.length === 1 ? "1 Charakter" : infos.length + " Charaktere";
})();
</script>
</body>
</html>
